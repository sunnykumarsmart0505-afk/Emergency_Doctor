```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen p-6">

<div class="max-w-4xl mx-auto">

    <h1 class="text-3xl font-bold text-blue-600 mb-6">
        Patient Dashboard
    </h1>

    <!-- Patient ID -->

    <div class="bg-white p-6 rounded-lg shadow mb-6">

        <label class="block font-semibold mb-2">
            Enter Patient ID
        </label>

        <input
            type="number"
            id="patientId"
            placeholder="Example: 1"
            class="w-full p-3 border rounded mb-3"
        >

        <button
            onclick="loadPrescriptions()"
            class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">

            View My Prescriptions

        </button>

    </div>


    <!-- Prescriptions -->

    <div class="bg-white p-6 rounded-lg shadow">

        <h2 class="text-2xl font-bold mb-5">
            📋 My Prescriptions
        </h2>

        <div id="prescriptionList">

            <p class="text-gray-500">
                Enter your Patient ID to view prescriptions.
            </p>

        </div>

    </div>

</div>


<script>

async function loadPrescriptions() {

    const patientId =
        document.getElementById("patientId").value;

    const container =
        document.getElementById("prescriptionList");


    if (!patientId) {

        alert("Please enter your Patient ID.");

        return;
    }


    container.innerHTML = `
        <p class="text-gray-500">
            Loading prescriptions...
        </p>
    `;


    try {

        const response = await fetch(
            `http://localhost:3000/prescriptions/${patientId}`
        );

        const prescriptions = await response.json();


        if (!prescriptions.length) {

            container.innerHTML = `
                <div class="bg-gray-50 p-5 rounded">

                    <p class="text-gray-500">
                        No prescription found for this Patient ID.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML = prescriptions.map(p => `

            <div class="border border-blue-200 rounded-lg p-5 mb-5 bg-blue-50">

                <h3 class="text-xl font-bold text-blue-700 mb-3">

                    Prescription #${p.prescription_id}

                </h3>


                <p class="mb-2">

                    <strong>Diagnosis:</strong>
                    ${p.diagnosis}

                </p>


                <h4 class="font-bold mt-4 mb-2">
                    Medicines
                </h4>


                ${p.medicines.map(m => `

                    <div class="bg-white p-4 rounded-lg mb-3 shadow-sm">

                        <p>
                            <strong>Medicine:</strong>
                            ${m.medicine_name}
                        </p>

                        <p>
                            <strong>Dosage:</strong>
                            ${m.dosage}
                        </p>

                        <p>
                            <strong>Frequency:</strong>
                            ${m.frequency}
                        </p>

                        <p>
                            <strong>Duration:</strong>
                            ${m.duration}
                        </p>

                        <p>
                            <strong>Instructions:</strong>
                            ${m.instructions || "None"}
                        </p>

                    </div>

                `).join('')}


                <div class="mt-4">

                    <p>
                        <strong>Doctor Notes:</strong>
                        ${p.doctor_notes || "None"}
                    </p>

                </div>

            </div>

        `).join('');


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <p class="text-red-500">
                Server connection error.
            </p>
        `;
    }

}

</script>

</body>
</html>
```
