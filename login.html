```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Doctor - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Emergency Doctor
            </h1>
            <p class="text-gray-500 mt-2">
                Select your account type
            </p>
        </div>

        <!-- Role Selection -->
        <div class="grid grid-cols-3 gap-3 mb-6">

            <button onclick="selectRole('doctor')" id="doctorBtn"
                class="role-btn border-2 border-gray-200 rounded-xl p-4 hover:border-blue-500">
                👨‍⚕️
                <span class="block mt-2 font-semibold">Doctor</span>
            </button>

            <button onclick="selectRole('patient')" id="patientBtn"
                class="role-btn border-2 border-gray-200 rounded-xl p-4 hover:border-blue-500">
                🧑
                <span class="block mt-2 font-semibold">Patient</span>
            </button>

            <button onclick="selectRole('admin')" id="adminBtn"
                class="role-btn border-2 border-gray-200 rounded-xl p-4 hover:border-blue-500">
                🛡️
                <span class="block mt-2 font-semibold">Admin</span>
            </button>

        </div>

        <p id="selectedRole" class="text-center text-blue-600 font-semibold mb-5">
            Select a role
        </p>

        <!-- Login Form -->
        <form id="loginForm">

            <label class="block text-sm font-medium text-gray-700 mb-2">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
                placeholder="Enter username"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <label class="block text-sm font-medium text-gray-700 mb-2">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                placeholder="Enter password"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Login
            </button>

        </form>

        <p id="message" class="text-center mt-4 text-sm"></p>

    </div>


<script>

let selectedRole = "";

function selectRole(role) {

    selectedRole = role;

    document.querySelectorAll(".role-btn").forEach(btn => {
        btn.classList.remove(
            "border-blue-500",
            "bg-blue-50"
        );

        btn.classList.add("border-gray-200");
    });

    const selectedButton = document.getElementById(role + "Btn");

    selectedButton.classList.remove("border-gray-200");
    selectedButton.classList.add(
        "border-blue-500",
        "bg-blue-50"
    );

    document.getElementById("selectedRole").textContent =
        "Login as " + role.charAt(0).toUpperCase() + role.slice(1);
}


document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const message = document.getElementById("message");

    if (!selectedRole) {
        message.textContent = "Please select Doctor, Patient or Admin.";
        message.className = "text-center mt-4 text-sm text-red-600";
        return;
    }

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("http://localhost:3000/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password,
                role: selectedRole
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed");
        }

        // Save login information
        localStorage.setItem("token", data.token);
        localStorage.setItem("role", data.role);

        if (data.doctor_id) {
            localStorage.setItem("doctor_id", data.doctor_id);
        }

        if (data.patient_id) {
            localStorage.setItem("patient_id", data.patient_id);
        }

        message.textContent = "Login successful!";
        message.className = "text-center mt-4 text-sm text-green-600";

        // Redirect according to role
        setTimeout(() => {

            if (data.role === "doctor") {
                window.location.href = "doctor.html";

            } else if (data.role === "patient") {
                window.location.href = "patient-dashboard.html";

            } else if (data.role === "admin") {
                window.location.href = "admin-dashboard.html";
            }

        }, 700);

    } catch (error) {

        message.textContent = error.message;
        message.className = "text-center mt-4 text-sm text-red-600";

    }

});

</script>
