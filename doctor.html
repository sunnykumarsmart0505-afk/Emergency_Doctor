```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body class="bg-gray-100 p-8">

<div class="max-w-5xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
        Doctor's Dashboard (ID: 1)
    </h1>

    <div
        id="map"
        class="h-64 w-full rounded-lg mb-6 shadow-md border-2 border-white hidden">
    </div>

    <div id="doctor-list" class="space-y-6"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([28.53, 77.39], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);


// ===============================
// Load Doctor Tasks
// ===============================

async function loadDoctorTasks() {

    try {

        const response = await fetch(
            'http://localhost:3000/assigned-sos/1'
        );

        const list = await response.json();

        const container = document.getElementById('doctor-list');

        if (list.length === 0) {

            container.innerHTML =
                "<p class='text-gray-500'>No assigned emergencies.</p>";

            return;
        }

        container.innerHTML = list.map(item => `

            <div class="p-5 bg-white shadow rounded-lg border-l-4 border-red-500">

                <h2 class="text-xl font-bold text-red-600">
                    Patient: ${item.name}
                </h2>

                <p>
                    <strong>Patient ID:</strong>
                    ${item.patient_id}
                </p>

                <p>
                    <strong>Blood Group:</strong>
                    ${item.blood_group || "Not Available"}
                </p>

                <p>
                    <strong>Allergies:</strong>
                    ${item.allergies || "None"}
                </p>

                <div class="mt-4 flex gap-2 flex-wrap">

                    <button
                        onclick="showOnMap(${item.latitude}, ${item.longitude})"
                        class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                        View Location
                    </button>

                    <button
                        onclick="openPrescription(${item.patient_id}, ${item.session_id})"
                        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Create Prescription
                    </button>

                    <button
                        onclick="resolveEmergency(${item.session_id})"
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        Resolve
                    </button>

                </div>

                <!-- Prescription Section -->

                <div
                    id="prescription-${item.patient_id}"
                    class="mt-5">
                    
                    <p class="text-gray-500">
                        Loading prescription...
                    </p>

                </div>

            </div>

        `).join('');

        // Load prescriptions for every patient
        list.forEach(item => {
            loadPrescription(item.patient_id);
        });

    } catch (err) {

        console.error("Doctor Dashboard Error:", err);

    }
}


// ===============================
// Load Prescription
// ===============================

async function loadPrescription(patientId) {

    const container =
        document.getElementById(`prescription-${patientId}`);

    try {

        const response = await fetch(
            `http://localhost:3000/prescriptions/${patientId}`
        );

        const prescriptions = await response.json();

        if (!prescriptions.length) {

            container.innerHTML = `
                <div class="bg-gray-50 p-4 rounded">
                    <p class="text-gray-500">
                        No prescription created yet.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML = `

            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">

                <h3 class="text-lg font-bold text-blue-700 mb-3">
                    📋 Prescription
                </h3>

                ${prescriptions.map(p => `

                    <div class="bg-white p-4 rounded mb-3 shadow-sm">

                        <p>
                            <strong>Prescription ID:</strong>
                            ${p.prescription_id}
                        </p>

                        <p>
                            <strong>Diagnosis:</strong>
                            ${p.diagnosis}
                        </p>

                        ${p.medicines.map(m => `

                            <div class="mt-3 p-3 bg-gray-50 rounded">

                                <p>
                                    <strong>Medicine:</strong>
                                    ${m.medicine_name}
                                </p>

                                <p>
                                    <strong>Dosage:</strong>
                                    ${m.dosage}
                                </p>

                                <p>
                                    <strong>Frequency:</strong>
                                    ${m.frequency}
                                </p>

                                <p>
                                    <strong>Duration:</strong>
                                    ${m.duration}
                                </p>

                                <p>
                                    <strong>Instructions:</strong>
                                    ${m.instructions || "None"}
                                </p>

                            </div>

                        `).join('')}

                        <p class="mt-3">
                            <strong>Doctor Notes:</strong>
                            ${p.doctor_notes || "None"}
                        </p>

                    </div>

                `).join('')}

            </div>
        `;

    } catch (error) {

        console.error("Prescription Error:", error);

        container.innerHTML = `
            <p class="text-red-500">
                Unable to load prescription.
            </p>
        `;
    }
}


// ===============================
// Open Create Prescription
// ===============================

function openPrescription(patientId, sessionId) {

    window.location.href =
        `prescription.html?patient_id=${patientId}&session_id=${sessionId}`;
}


// ===============================
// Show Patient Location
// ===============================

function showOnMap(lat, lng) {

    document.getElementById('map')
        .classList.remove('hidden');

    map.setView([lat, lng], 15);

    L.marker([lat, lng])
        .addTo(map)
        .bindPopup("Patient Location")
        .openPopup();

    map.invalidateSize();
}


// ===============================
// Resolve Emergency
// ===============================

async function resolveEmergency(sessionId) {

    await fetch(
        `http://localhost:3000/update-status/${sessionId}`,
        {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: 'RESOLVED'
            })
        }
    );

    alert("Emergency Marked as Resolved!");

    loadDoctorTasks();
}


// Initial Load
loadDoctorTasks();

// Auto refresh every 5 seconds
setInterval(loadDoctorTasks, 5000);

</script>

</body>
</html>
```
